<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dot Army</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="toolbar">
    <button id="btn-pause" title="Pause" aria-label="Pause">⏸</button>
    <button id="btn-restart" title="New game" aria-label="New game">↻</button>
    <button id="btn-mute" title="Sound" aria-label="Toggle sound">🔊</button>
    <button id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Dot Army</h2>
      <div class="row">
        <div class="row-name" id="lbl-mode">Opponent</div>
        <div class="opts" role="radiogroup" aria-labelledby="lbl-mode">
          <label><input type="radio" name="mode" value="2p"><span>Human</span></label>
          <label><input type="radio" name="mode" value="cpu-easy"><span>Easy CPU</span></label>
          <label><input type="radio" name="mode" value="cpu"><span>Hard CPU</span></label>
        </div>
      </div>
      <div class="row">
        <div class="row-name" id="lbl-size">Board</div>
        <div class="opts" role="radiogroup" aria-labelledby="lbl-size">
          <label><input type="radio" name="size" value="small"><span>Small</span></label>
          <label><input type="radio" name="size" value="medium"><span>Medium</span></label>
          <label><input type="radio" name="size" value="large"><span>Large</span></label>
        </div>
      </div>
      <div class="row">
        <div class="row-name" id="lbl-speed">Speed</div>
        <div class="opts" role="radiogroup" aria-labelledby="lbl-speed">
          <label><input type="radio" name="speed" value="slow"><span>Slow</span></label>
          <label><input type="radio" name="speed" value="average"><span>Average</span></label>
          <label><input type="radio" name="speed" value="fast"><span>Fast</span></label>
        </div>
      </div>
      <div class="row">
        <div class="row-name" id="lbl-spawns">Spawns</div>
        <div class="opts" role="radiogroup" aria-labelledby="lbl-spawns">
          <label><input type="radio" name="spawns" value="few"><span>Few</span></label>
          <label><input type="radio" name="spawns" value="some"><span>Some</span></label>
          <label><input type="radio" name="spawns" value="many"><span>Many</span></label>
        </div>
      </div>
      <div class="row">
        <div class="row-name" id="lbl-obstacles">Obstacles</div>
        <div class="opts" role="radiogroup" aria-labelledby="lbl-obstacles">
          <label><input type="radio" name="obstacles" value="none"><span>None</span></label>
          <label><input type="radio" name="obstacles" value="some"><span>Some</span></label>
          <label><input type="radio" name="obstacles" value="many"><span>Many</span></label>
        </div>
      </div>
      <p class="hint">Drag your marker; your dots follow. A dot destroys an enemy it's facing, unless that enemy faces it back. Park your marker on or beside a spawn point to attack it. With a CPU opponent, you're blue. Capture every spawn to win. <a href="https://github.com/schuyler/fidget-toys/blob/main/dot-army/RULES.md" target="_blank" rel="noopener">Full rules</a></p>
      <menu>
        <button value="reset" formnovalidate>Defaults</button>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="apply" class="primary">New game</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
