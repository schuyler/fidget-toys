<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dot Army</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="toolbar">
    <button id="btn-pause" title="Pause" aria-label="Pause">⏸</button>
    <button id="btn-restart" title="New game" aria-label="New game">↻</button>
    <button id="btn-mute" title="Sound" aria-label="Toggle sound">🔊</button>
    <button id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Dot Army</h2>
      <label>Opponent
        <select name="mode">
          <option value="2p">Human</option>
          <option value="cpu-easy">Easy CPU</option>
          <option value="cpu">Hard CPU</option>
        </select>
      </label>
      <label>Board
        <select name="size">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </label>
      <label>Speed
        <select name="speed">
          <option value="slow">Slow</option>
          <option value="average">Average</option>
          <option value="fast">Fast</option>
        </select>
      </label>
      <label>Spawns
        <select name="spawns">
          <option value="few">Few</option>
          <option value="some">Some</option>
          <option value="many">Many</option>
        </select>
      </label>
      <label>Obstacles
        <select name="obstacles">
          <option value="none">None</option>
          <option value="some">Some</option>
          <option value="many">Many</option>
        </select>
      </label>
      <p class="hint">Drag your marker; your dots follow. A dot destroys an enemy it's facing, unless that enemy faces it back. Park your marker on or beside a spawn point to attack it. With a CPU opponent, you're blue. Capture every spawn to win. <a href="https://github.com/schuyler/fidget-toys/blob/main/dot-army/RULES.md" target="_blank" rel="noopener">Full rules</a></p>
      <menu>
        <button value="reset" formnovalidate>Defaults</button>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="apply" class="primary">New game</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
